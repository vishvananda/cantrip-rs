[package]
name = "cantrip-oracle-codegen"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENSE"
description = "Owned Oracle IR to Cantrip Rust; standalone tooling, outside engine builds"

[workspace]

[dependencies]
oracle-ir = { version = "=0.2.0", default-features = false }
oracle-ir-contract = { version = "=0.2.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
ron = "0.8.1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
prettyplease = "0.2"
proc-macro2 = "1"

[profile.dev]
debug = 0
[profile.dev.package."*"]
opt-level = 2
